<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>功能展示 · 图片卡</title>
<link rel="stylesheet" href="screen.css">
<style>
  .pic {
    position: relative;
    height: 236px;
    border-radius: var(--r-card);
    overflow: hidden;
    background: var(--deep-navy);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pic .art { width: 150px; height: 150px; }
  .pic .art .line { fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .pic .art .green { fill: var(--pop-green); }
  /* 文字压图底部：底部渐变压暗保证可读 */
  .pic .foot {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 40px 24px 22px;
    background: linear-gradient(to top, rgba(20,19,40,.92) 0%, rgba(20,19,40,.7) 45%, rgba(20,19,40,0) 100%);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  .pic .foot h3 { font-size: 18px; font-weight: 700; color: #fff; }
  .pic .foot p { margin-top: 3px; font-size: 13px; color: rgba(255,255,255,.7); }
  /* hover 才出现的操作 */
  .pic .acts { position: absolute; top: 16px; right: 16px; display: flex; gap: 8px; }
  .pic .acts span {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: var(--r-pill);
    background: rgba(255,255,255,.16); color: #fff;
    backdrop-filter: blur(6px);
  }
  .pic .acts svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .btn-sm { height: 40px; padding: 0 20px; font-size: 14px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
</style>
</head>
<body>
<div class="screen">
  <h1 class="h1">图片卡</h1>
  <p class="sub">大图铺满 r-24，文字压图底部，配 pill 描边幽灵按钮</p>

  <div class="sec stack">

    <!-- Hover 态：右上角浮出操作按钮 -->
    <div class="pic">
      <svg class="art" viewBox="0 0 120 120">
        <path class="line" d="M60 22c14 0 25 11 25 25 0 12-8 19-13 24-3 3-4 6-4 9H52c0-3-1-6-4-9-5-5-13-12-13-24 0-14 11-25 25-25z"/>
        <path class="line" d="M52 84h16M54 92h12"/>
        <rect class="green" x="50" y="98" width="20" height="14" rx="3"/>
        <path class="line" d="M35 47h50M60 22v62"/>
      </svg>
      <span class="acts">
        <span><svg viewBox="0 0 24 24"><path d="M12 20.5S3.5 15 3.5 9.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8.5 2.5c0 5.5-8.5 11-8.5 11z"/></svg></span>
        <span><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.1M8.2 13.2l7.6 4.1"/></svg></span>
      </span>
      <div class="foot">
        <div>
          <h3>热气球之旅</h3>
          <p>L4 · 4 分钟 · 10 轮对话</p>
        </div>
        <span class="btn btn-ghost btn-sm">开始</span>
      </div>
    </div>
    <p class="note">↑ Hover 态：右上角浮出收藏 / 分享，底部幽灵描边按钮</p>

    <!-- 常态 -->
    <div class="pic">
      <svg class="art" viewBox="0 0 120 120">
        <rect class="line" x="26" y="32" width="68" height="64" rx="10"/>
        <path class="line" d="M26 52h68M44 24v16M76 24v16"/>
        <rect class="green" x="66" y="66" width="18" height="18" rx="4"/>
      </svg>
      <div class="foot">
        <div>
          <h3>每周打卡</h3>
          <p>连续 12 天 · 目标 5/7</p>
        </div>
      </div>
    </div>
    <p class="note">↑ 常态：无操作按钮，只有标题与副文</p>

  </div>
</div>
</body>
</html>
