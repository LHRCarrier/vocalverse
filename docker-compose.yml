# ============================================================
# VocalVerse Docker Compose —— dev 一键起：db → redis → python → java → web
# 用法：docker compose up -d --build
# 端口：PG 5432 / Redis 6379 / Python 8000 / Java 8080 / Web 8088
# 注意：Web 默认映射 8088（80 端口在 Windows 需管理员权限）
# ============================================================

name: vocalverse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vocalverse}
      POSTGRES_USER: ${POSTGRES_USER:-vocalverse}
      # 显式必填（PR#34 评审 R5）：原写法 `${POSTGRES_PASSWORD:-vocalverse-dev}` 会在忘记 .env 时
      # 静默用弱口令起库；本文件对 JWT_SECRET / SERVICE_TOKEN 早就是 `:?required`，此处对齐。
      # 缺值 → `docker compose up` 直接报错（README §2 已同步为"必须复制 .env"）。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (copy .env.example to .env)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vocalverse} -d ${POSTGRES_DB:-vocalverse}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  python-api:
    build:
      context: ./services/python
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vocalverse}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (copy .env.example to .env)}@postgres:5432/${POSTGRES_DB:-vocalverse}
      APP_REDIS_URL: redis://redis:6379/0
      # 密钥显式必填（docs/19 P0-9：缺值 compose 直接报错；dev 值由 .env 提供，.env.example 含占位）
      APP_JWT_SECRET: ${APP_JWT_SECRET:?required}
      APP_SERVICE_TOKEN: ${APP_SERVICE_TOKEN:?required}
      # 模型使用镜像内预下载副本（docs/06 §8 / 审计 R-11：容器网络到 HF 不可达；本地裸跑仍走 'small' 联网下载）
      APP_ASR_MODEL: /app/models/whisper-small
      # 内部 REST 委托地址（docs/21 §4：Python → Java 的参考旋律门禁翻转 / 档位回写 / 打卡卡物化）。
      # 必须用**容器网络服务名**：`config.py` 默认 `http://localhost:8080` 只适用于裸跑（host 上的 Java），
      # 在容器内指容器自己 → Connection refused（2026-09-10 复测实测：提取完成却翻不了 ready，
      # 新环境/世代重建后歌曲永久 40905）。
      # PR#34 评审 R5：不再是钉死的字面量，但**不能用** `${APP_JAVA_BASE_URL:-...}`——
      # 根 `.env` 会被 compose 读入插值，而它的 `APP_JAVA_BASE_URL` 语义是"裸跑地址"（localhost），
      # 那样等于把 F2 重新装回去（compose 的默认值只在 .env 缺该键时生效）。
      # 故容器侧独立键 `APP_JAVA_BASE_URL_DOCKER`，默认即服务名；要指向容器外
      # （如 host.docker.internal:8080 上的 Java）时显式覆盖它即可。
      # `environment:` 优先级高于 `env_file:`，所以根 .env 的同名键不会污染容器。
      APP_JAVA_BASE_URL: ${APP_JAVA_BASE_URL_DOCKER:-http://java-api:8080}
      # 容器只跑运行时依赖：镜像构建是 `uv sync --frozen --no-dev`，而 `uv run` 默认**带上 dev 组**
      # → 每次容器启动都会去 PyPI 下载 ruff/mypy/pytest 等（2026-09-10 合并期实测：网络慢时启动
      # 卡在下载、健康检查失败、依赖它的 web 起不来）。置 UV_NO_DEV=1 让 `uv run` 跳过 dev 组同步。
      UV_NO_DEV: "1"
    # docs/06 §8：whisper 信号量 2 下多 worker 收益为负（每进程 ≈500MB 模型）；内存 ≥2GB 显式护栏
    mem_limit: 2g
    ports:
      - "8000:8000"
    volumes:
      - ./data/audio:/app/data/audio
      # 媒体卷（社区 S3 · docs/47 §4.1）：缺卷时容器重建 → DB 行指向已消失文件 → 全部 404
      # （docs/48 B10）
      - ./data/media:/app/data/media
      # seed 资产（2026-09-14）：读书域书封图走 `GET /api/v1/reading/covers/{name}`，从
      # `data/seed/covers/` 读（随仓库分发的**公版**图，`.gitignore` 豁免 `data/seed/**`）。
      # 只读挂载；migrate 服务已挂同名卷（书正文 JSON 亦在此）。
      - ./data/seed:/app/data/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 一次性迁移（docs/11 S-8 / docs/18 拍板 10）：DB 就绪后执行 alembic upgrade head + seed，退出码 0 即成功
  migrate:
    build:
      context: ./services/python
    env_file:
      - path: .env
        required: false
    # 2026-09-14：补 `app.db.seed_reading`。此前 compose 只播 scenarios/placement，
    # **读书域（books + 词典）从来没被播过** → 容器形态下书房是空的、查词必定查不到
    # （本地之所以"有书"是因为开发时手工跑过 `-m app.db.seed_reading`，掩盖了这个缺口）。
    # 两个 seed 都是幂等（自然键判重），重复执行安全。
    command:
      - "sh"
      - "-c"
      - "uv run alembic upgrade head && uv run python -m app.db.seed && uv run python -m app.db.seed_reading"
    volumes:
      # seed 数据在仓库根 data/seed（构建上下文仅 services/python，镜像内无）——挂载供容器内播种
      - ./data/seed:/app/data/seed
    environment:
      APP_ENV: development
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vocalverse}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (copy .env.example to .env)}@postgres:5432/${POSTGRES_DB:-vocalverse}
      APP_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  java-api:
    build:
      context: ./services/java
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-vocalverse}
      DB_USER: ${POSTGRES_USER:-vocalverse}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (copy .env.example to .env)}
      # 密钥显式必填（docs/19 P0-9：缺值 compose 直接报错；dev 值由 .env 提供，.env.example 含占位）
      JWT_SECRET: ${JWT_SECRET:?required}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?required}
    ports:
      - "8080:8080"
    volumes:
      # 曲目种子元数据（M3 唱歌 P0 D-G2）：SongSeeder 读 data/seed/songs.json 播种 songs+lrc；
      # 音频本体在共享卷 ./data/audio（python-api 挂载；Java 只存路径字符串，不读音频）
      - ./data/seed:/app/data/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
      python-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./apps/web
    ports:
      - "8088:80"
    depends_on:
      python-api:
        condition: service_healthy
      java-api:
        condition: service_healthy

  # 管理端控制台（独立 SPA · docs/50）。
  # 挂在 profile 里：默认 `docker compose up` **不启动**它，
  # 因此 README 的「五服务全 healthy」验收口径与部署流程零变化；
  # 需要时显式拉起：
  #   docker compose --profile console up -d --build admin-console
  #   → http://localhost:8089/console/
  admin-console:
    profiles: ["console"]
    build:
      context: ./apps/admin
    ports:
      - "8089:80"
    # 控制台只是静态产物 + 反代，健康不依赖上游起来（上游不可用时页面自己报错更好排查）
    depends_on:
      python-api:
        condition: service_started
      java-api:
        condition: service_started

volumes:
  pgdata:
