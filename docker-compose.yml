# ============================================================
# VocalVerse Docker Compose —— dev 一键起：db → redis → python → java → web
# 用法：docker compose up -d --build
# 端口：PG 5432 / Redis 6379 / Python 8000 / Java 8080 / Web 8088
# 注意：Web 默认映射 8088（80 端口在 Windows 需管理员权限）
# ============================================================

name: vocalverse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vocalverse}
      POSTGRES_USER: ${POSTGRES_USER:-vocalverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocalverse-dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vocalverse} -d ${POSTGRES_DB:-vocalverse}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  python-api:
    build:
      context: ./services/python
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vocalverse}:${POSTGRES_PASSWORD:-vocalverse-dev}@postgres:5432/${POSTGRES_DB:-vocalverse}
      APP_REDIS_URL: redis://redis:6379/0
      # 密钥显式必填（docs/19 P0-9：缺值 compose 直接报错；dev 值由 .env 提供，.env.example 含占位）
      APP_JWT_SECRET: ${APP_JWT_SECRET:?required}
      APP_SERVICE_TOKEN: ${APP_SERVICE_TOKEN:?required}
      # 模型使用镜像内预下载副本（docs/06 §8 / 审计 R-11：容器网络到 HF 不可达；本地裸跑仍走 'small' 联网下载）
      APP_ASR_MODEL: /app/models/whisper-small
      # 内部 REST 委托地址（docs/21 §4：Python → Java 的参考旋律门禁翻转 / 档位回写 / 打卡卡物化）。
      # 必须用**容器网络服务名**：`config.py` 默认 `http://localhost:8080` 只适用于裸跑（host 上的 Java），
      # 在容器内指容器自己 → Connection refused（2026-09-10 复测实测：提取完成却翻不了 ready，
      # 新环境/世代重建后歌曲永久 40905）。故此处显式钉死，不受 .env 影响。
      APP_JAVA_BASE_URL: http://java-api:8080
    # docs/06 §8：whisper 信号量 2 下多 worker 收益为负（每进程 ≈500MB 模型）；内存 ≥2GB 显式护栏
    mem_limit: 2g
    ports:
      - "8000:8000"
    volumes:
      - ./data/audio:/app/data/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 一次性迁移（docs/11 S-8 / docs/18 拍板 10）：DB 就绪后执行 alembic upgrade head + seed，退出码 0 即成功
  migrate:
    build:
      context: ./services/python
    env_file:
      - path: .env
        required: false
    command: ["sh", "-c", "uv run alembic upgrade head && uv run python -m app.db.seed"]
    volumes:
      # seed 数据在仓库根 data/seed（构建上下文仅 services/python，镜像内无）——挂载供容器内播种
      - ./data/seed:/app/data/seed
    environment:
      APP_ENV: development
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vocalverse}:${POSTGRES_PASSWORD:-vocalverse-dev}@postgres:5432/${POSTGRES_DB:-vocalverse}
      APP_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  java-api:
    build:
      context: ./services/java
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-vocalverse}
      DB_USER: ${POSTGRES_USER:-vocalverse}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vocalverse-dev}
      # 密钥显式必填（docs/19 P0-9：缺值 compose 直接报错；dev 值由 .env 提供，.env.example 含占位）
      JWT_SECRET: ${JWT_SECRET:?required}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?required}
    ports:
      - "8080:8080"
    volumes:
      # 曲目种子元数据（M3 唱歌 P0 D-G2）：SongSeeder 读 data/seed/songs.json 播种 songs+lrc；
      # 音频本体在共享卷 ./data/audio（python-api 挂载；Java 只存路径字符串，不读音频）
      - ./data/seed:/app/data/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
      python-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./apps/web
    ports:
      - "8088:80"
    depends_on:
      python-api:
        condition: service_healthy
      java-api:
        condition: service_healthy

volumes:
  pgdata:
