# VocalVerse Web nginx —— 容器内反向代理到 python-api / java-api
server {
    listen 80;
    server_name _;

    # 上传限制（nginx 默认 1MB，会挡掉 60s 录音与视频）。与 docs/06 §8「音频 ≤20MB」、
    # docs/47 §4.1「视频 ≤64MB」对齐。
    # ⚠️ 改视频上限必须同时改 services/python/app/core/config.py 的 media_max_video_bytes：
    #    网关先于 Python 生效，否则 >20MB 的请求在 nginx 就被 413 —— 见 docs/48 B3。
    # 2026-09-10（P0-6 纵深防御）：数值取 **65m = max(20MB 音频, 64MB 视频) + multipart 封装余量**，
    # 与 Python 侧 `body_limit.py`（同源取 max + 1MB）一致；另补 `error_page 413` 返回 **JSON
    # envelope**——nginx 默认 HTML 错误页会让前端只显示 `HTTP 413`（`api/client.ts` 只解析
    # {code,message,data}，docs/api/error-codes.md 41301）。
    client_max_body_size 65m;

    error_page 413 = @err413;
    location @err413 {
        default_type application/json;
        return 413 '{"code":41301,"message":"payload too large (> 20MB media / 64MB video)","data":null}';
    }

    root /usr/share/nginx/html;
    index index.html;

    # ---------- X-Request-Id 全链路 trace（docs/06 §11） ----------
    # 上游无 X-Request-Id 时用内置 $request_id 生成；透传给下游并回写响应头。
    # ⚠️ server 上下文里 if 仅放 set 赋值；proxy_* 指令放各 location。
    set $req_id $http_x_request_id;
    if ($req_id = "") {
        set $req_id $request_id;
    }
    add_header X-Request-Id $req_id always;

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 语音/LLM 热路径：Python（docs/06 第 1 章）
    location /api/v1/ {
        proxy_pass http://python-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $req_id;
        # SSE
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /healthz {
        proxy_pass http://python-api:8000;
        proxy_set_header X-Request-Id $req_id;
    }
    location /readyz {
        proxy_pass http://python-api:8000;
        proxy_set_header X-Request-Id $req_id;
    }

    # 管理端：Java
    # ⚠️ 与 vite.config.ts 的 '/manage' 代理保持语义一致：proxy_pass 尾斜杠 `http://java-api:8080/`
    #    = 剥离 /manage/ 前缀（对应 vite 的 rewrite）。两处只能同步改（docs/06 §2.1 注记 3）。
    location /manage/ {
        proxy_pass http://java-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $req_id;
    }

    # 内部委托端点仅限 compose 内网直连（java-api:8080），经网关一律 404（docs/19 P0-9：
    # 此前 /manage/internal/** 对外可达，任何人可伪造/冒用 service-token 通道）
    # （2026-09-07 评审：去掉尾斜杠——nginx 前缀匹配亦覆盖无尾斜杠 `/manage/internal`，
    #   否则该形式落回 /manage/ 前缀被代理）
    location /manage/internal {
        return 404;
    }
}
