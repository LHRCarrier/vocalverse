# VocalVerse Web nginx —— 容器内反向代理到 python-api / java-api
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 语音/LLM 热路径：Python（docs/06 第 1 章）
    location /api/v1/ {
        proxy_pass http://python-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # SSE
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /healthz { proxy_pass http://python-api:8000; }
    location /readyz  { proxy_pass http://python-api:8000; }

    # 管理端：Java
    location /manage/ {
        proxy_pass http://java-api:8080/;
        proxy_set_header Host $host;
    }
}
