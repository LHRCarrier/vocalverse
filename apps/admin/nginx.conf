# 管理端控制台的生产入口（docs/50 §13.1）。
#
# 为什么是**独立 server 块**而不是塞进 apps/web/nginx.conf：
# 控制台是独立产物、独立发布节奏（docs/50 §2.2 理由 3）。用户端 nginx 的
# `location / { try_files ... /index.html; }` 会把控制台的 SPA 路由吃成用户端首页。
# 因此控制台自带一个容器 + 一个 server 块，`apps/web/nginx.conf` **零改动**。
#
# ⚠️ 与 vite.config.ts 的 dev 代理必须同语义（改一处必须改三处：vite / 本文件 / 文档）：
#     /vite:  '/manage' → localhost:8080 (rewrite 剥 /manage) ; '/api/v1' → localhost:8000
#     本文件: /console/manage/  → java-api:8080/   (尾斜杠剥前缀)
#             /console/api/v1/  → python-api:8000/ (尾斜杠剥前缀)
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 控制台是内部工具：不进搜索引擎
  add_header X-Robots-Tag "noindex, nofollow" always;

  # ---------- X-Request-Id 全链路 trace（docs/06 §11 / docs/50 §9.2） ----------
  # ⚠️ proxy_set_header 不是 server 级继承项：**每个 location 都要单独写一遍**，
  # 漏写的那条链路会各自生成 uuid，导致「浏览器回显 = Java 审计行 = Python 日志」
  # 三处对不上（并发日志拷问 B-4）。原来 4 个 location 都写了，这里同样逐条写。
  set $req_id $http_x_request_id;
  if ($req_id = "") {
    set $req_id $request_id;
  }
  add_header X-Request-Id $req_id always;

  # gzip：控制台产物里 naive-ui / echarts 是大头，压缩收益明显
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # 静态产物：文件名带内容哈希 → 长缓存
  location /console/assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # ---------- Java 控制台域：身份 / RBAC / 审计 / 审核 / 内容 ----------
  location /console/manage/ {
    proxy_pass http://java-api:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $req_id;
    # 审核/内容操作是低频人工动作，超时给宽一点；但不要无限等
    proxy_read_timeout 60s;
  }

  # 内部接口不对外暴露（与用户端 nginx 同口径）
  location /console/manage/internal {
    return 404;
  }

  # ---------- Python 运维域：指标 / 预警 / LLM trace / 书籍 / 媒体 ----------
  location /console/api/v1/ {
    proxy_pass http://python-api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $req_id;
    # 指标查询可能扫较多行（服务端已限点数与指标条数）
    proxy_read_timeout 30s;
    # 媒体治理列表可能很大，但控制台不吃上传
    client_max_body_size 1m;
  }

  # ---------- SPA 兜底 ----------
  location /console/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /console/index.html;
    add_header X-Request-Id $req_id always;
  }

  # 根路径直接进控制台（独立域名部署时更自然）
  location = / {
    return 302 /console/;
  }
}
