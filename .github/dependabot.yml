version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, m1]

  - package-ecosystem: pip
    directory: /services/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, m1]

  - package-ecosystem: maven
    directory: /services/java
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, m1]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
