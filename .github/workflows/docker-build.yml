name: docker-build

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build images (ghcr)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: vocalverse-python-api
            context: ./services/python
          - image: vocalverse-java-api
            context: ./services/java
          - image: vocalverse-web
            context: ./apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # 注意：Docker 仓库名必须小写；github.repository_owner 可能是大写（如 LHRCarrier），
          # 故这里写死小写 owner；仓库迁移时同步更新。
          # 注意：GHA 缓存（type=gha）需要 buildx 的 docker-container 驱动（默认 docker 驱动不支持）。
          tags: |
            ghcr.io/lhrcarrier/${{ matrix.image }}:latest
            ghcr.io/lhrcarrier/${{ matrix.image }}:${{ github.sha }}
