name: frontend-ci

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-ci.yml"
  # 手动补跑（2026-09-07 评审处置：本仓 pull_request 触发当前未生效——PR 分支推送 0 run；
  # 与 python-ci 同款兜底，见其注释）
  # 2026-09-10 补：push(main) 兜底（与 python-ci:10-14 对齐）——唱歌模块审计 E-2 实测：
  # 本仓 PR 触发不可靠，仅靠 pull_request 会让 main 上的前端代码零自动验证。
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      - name: "Contract: regenerate types from snapshot"
        run: pnpm gen:api

      - name: "Contract: no generated-type drift"
        # 生成文件必须随契约快照入库：后端契约变更后跑 scripts/refresh-openapi.ps1 一步刷新。
        # 只改了快照没重新生成（或反向）→ 此步红。
        run: git diff --exit-code -- src/api/generated/

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        # 2026-09-10 修正（唱歌模块审计 E-1）：`package.json` 的 typecheck 曾是
        # `vue-tsc --noEmit`（根 tsconfig 为 solution 配置 files:[]+references）→ **0 文件被检查**、
        # 恒绿；已改为 `-p tsconfig.app.json && -p tsconfig.node.json`。
        # 本步因此首次成为**真实**类型门禁：若它突然红，先查是否是历史类型错被暴露（不要改回空操作）。
        run: pnpm typecheck

      - name: Test
        run: pnpm test -- --run

      - name: Build
        run: pnpm build

      - name: "Bundle 门禁（fe-09：preview 树零体积 / p5 不进入口块 / echarts 零残留）"
        run: node scripts/check-bundle.mjs
