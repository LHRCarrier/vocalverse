name: java-ci

on:
  pull_request:
    paths:
      - "services/java/**"
      - ".github/workflows/java-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: verify (spotless · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/java
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify (spotless:check + tests)
        run: mvn -B -ntp verify -DskipITs
        env:
          MAVEN_OPTS: -Xmx1024m
