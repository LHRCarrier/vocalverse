name: java-ci

on:
  pull_request:
    paths:
      - "services/java/**"
      - ".github/workflows/java-ci.yml"
      # 契约快照/生成文件变更也重新对账（ContractSnapshotTest，docs/06 §7）
      - "apps/web/src/api/specs/java-openapi.json"
      - "apps/web/src/api/generated/java-api.d.ts"
  # 手动补跑（2026-09-07 评审处置：本仓 pull_request 触发当前未生效——PR 分支推送 0 run；
  # 与 python-ci 同款兜底，见其注释）
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: verify (spotless · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/java
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Gate — JPQL 不得出现 PG 无类型参数（真 PG 实测缺陷族，H2 测不出）
        # 2026-09-10：`(:p is null or …)`（时间戳）与 `concat('%', :q, '%')` 里的裸参数
        # 会让 PostgreSQL 在 Parse 阶段拒绝整条 SQL（could not determine data type of parameter /
        # function lower(bytea) does not exist），而 H2 全绿 —— 实测 publish-events / audit-logs / users
        # 三个端点清空筛选即 500。此门禁把这一类钉死在提交前。
        working-directory: .
        run: python3 scripts/check_pg_typed_params.py

      - name: Verify (spotless:check + tests)
        # J-07（2026-09-08）：@Tag("integration")（真 PG Testcontainers）由 surefire
        # excludedGroups 默认排除——本 job 即 CI 单测档；本地必跑集成：
        #   cd services/java && mvn verify -Pintegration
        # （需 Docker + uv；schema 迁移走 services/python alembic upgrade head）
        run: mvn -B -ntp verify -DskipITs
        env:
          MAVEN_OPTS: -Xmx1024m
