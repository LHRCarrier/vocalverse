name: python-ci

on:
  pull_request:
    paths:
      - "services/python/**"
      - ".github/workflows/python-ci.yml"
  # 兜底（PR#25 复审，2026-09-09）：本仓 pull_request 触发当前未生效（PR #24/#25 打开/同步均 0 run）。
  # push(main) 保证合入后的真实代码必被门禁；workflow_dispatch 供手动补跑（gh workflow run python-ci）。
  push:
    branches: [main]
    paths:
      - "services/python/**"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint · test · alembic
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/python
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Lockfile in sync
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -m "not gpu" -q

      - name: "Contract: OpenAPI snapshot in sync"
        # 契约真源 = 运行中的后端 /openapi.json；前端快照（apps/web/src/api/specs/）必须与之一致。
        # 后端契约变更后重跑 scripts/refresh-openapi.ps1 并提交快照，否则此步红。
        run: |
          uv run python - <<'EOF'
          import json
          from pathlib import Path

          from app.main import app

          snapshot = Path("../../apps/web/src/api/specs/python-openapi.json")
          if not snapshot.exists():
              raise SystemExit(f"契约快照缺失：{snapshot}")
          committed = json.loads(snapshot.read_text(encoding="utf-8"))
          live = app.openapi()
          if committed != live:
              raise SystemExit(
                  "契约快照与后端 OpenAPI 不一致：后端契约变更后需重新导出并提交快照"
                  "（scripts/refresh-openapi.ps1 + pnpm gen:api 生成的类型一并提交）"
              )
          print("ok：契约快照与后端 OpenAPI 一致")
          EOF

      - name: Alembic single head assert
        run: |
          uv run alembic heads
          # 项目从 0001 起必有且仅有一个头（docs/11 Q-A11：0 头=迁移缺失，必须红）
          test "$(uv run alembic heads | grep -c '(head)')" -eq 1 \
            || { echo '::error:: alembic 头数 != 1（0 头=迁移缺失；多头=历史分叉）'; exit 1; }
          # 注：alembic check（模型 vs 迁移一致）需连库执行；M2 接入 PG 后改为带 DB 的集成步骤再启用
