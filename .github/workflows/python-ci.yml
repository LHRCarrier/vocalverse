name: python-ci

on:
  pull_request:
    paths:
      - "services/python/**"
      - ".github/workflows/python-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint · test · alembic
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/python
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Lockfile in sync
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -m "not gpu" -q

      - name: Alembic single head assert
        run: |
          uv run alembic heads
          # 项目从 0001 起必有且仅有一个头（docs/11 Q-A11：0 头=迁移缺失，必须红）
          test "$(uv run alembic heads | grep -c '(head)')" -eq 1 \
            || { echo '::error:: alembic 头数 != 1（0 头=迁移缺失；多头=历史分叉）'; exit 1; }
          # 注：alembic check（模型 vs 迁移一致）需连库执行；M2 接入 PG 后改为带 DB 的集成步骤再启用
