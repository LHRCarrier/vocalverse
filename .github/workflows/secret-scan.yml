name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  # 手动补跑（2026-09-07 评审处置：本仓 pull_request 触发当前未生效——PR 分支推送 0 run；
  # 与 python-ci 同款兜底，见其注释）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          scan_arguments: --results=verified,unknown --fail --no-update
