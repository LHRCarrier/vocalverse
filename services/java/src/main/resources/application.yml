spring:
  application:
    name: vocalverse-java-api
  jpa:
    hibernate:
      ddl-auto: none # schema 由 Alembic 统一管理（docs/06 第 10 章）
    open-in-view: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vocalverse}
    username: ${DB_USER:vocalverse}
    password: ${DB_PASSWORD:vocalverse-dev}

server:
  port: 8080

# 日志带 requestId（RequestIdFilter 写 MDC，docs/06 §11）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"

# 服务间契约密钥（docs/06 §11：Python 验签用同值；禁止提交真实值，.env 覆盖）
vocalverse:
  app-env: ${APP_ENV:development}  # development | production（production 强制强密钥，见 SecretGuard）
  jwt:
    secret: ${JWT_SECRET:vocalverse-dev-jwt-secret-0123456789abcdef}
    access-ttl-seconds: 3600
  service-token: ${SERVICE_TOKEN:change-me-internal-service-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
