spring:
  application:
    name: vocalverse-java-api
  jpa:
    hibernate:
      ddl-auto: none # schema 由 Alembic 统一管理（docs/06 第 10 章）
    open-in-view: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vocalverse}
    username: ${DB_USER:vocalverse}
    password: ${DB_PASSWORD:vocalverse-dev}

server:
  port: 8080

# 日志带 requestId（RequestIdFilter 写 MDC，docs/06 §11）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"

# 服务间契约密钥（docs/06 §11：Python 验签用同值；docs/19 P0-9：仓库不落默认密钥——
# 必须由环境变量注入（compose 显式 `${JWT_SECRET:?required}`，.env 提供 dev 值；缺失即启动失败）
vocalverse:
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl-seconds: 3600
  service-token: ${SERVICE_TOKEN:}
  community:
    # 公众发帖开关（docs/37 A-15：公开仓库默认关闭；仅演示环境开启）
    post-enabled: ${VOICEVERSE_COMMUNITY_POST_ENABLED:false}
    # 演示内容种子（虚构作者 + 8 帖 + 历史打卡卡；仅演示环境）
    seed: ${VOICEVERSE_COMMUNITY_SEED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
