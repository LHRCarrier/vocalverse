# 测试环境：H2 内存库（不依赖外部 PostgreSQL；集成测试用 Testcontainers，@Tag("integration")）
spring:
  datasource:
    url: jdbc:h2:mem:vocalverse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop # 仅测试：H2 建表（生产 ddl-auto=none，schema 真源= Alembic）

vocalverse:
  jwt:
    secret: vocalverse-dev-jwt-secret-0123456789abcdef
  service-token: change-me-internal-service-token
