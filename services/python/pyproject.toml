[project]
name = "vocalverse-python-api"
version = "0.1.0"
description = "VocalVerse Python 服务：ASR / TTS / 发音评分 / 唱歌评分 / LLM 场景扮演 / 推荐"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.0",
    "httpx>=0.27",
    "loguru>=0.7",
    "python-multipart>=0.0.9",
    # 语音管线（CPU 版）
    "faster-whisper>=1.0",
    "edge-tts>=6.1",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.26",
    # 推荐与水平预测
    "scikit-learn>=1.5",
    # ML 训练（仅 CPU 推理；训练在云 GPU 独立环境）
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "imageio-ffmpeg>=0.6.0",
]

[tool.uv]
# 应用型项目：不打包安装，仅作为源码运行（uv run uvicorn app.main:app）
package = false
# torch 仅装 CPU 轮子（勿用默认 CUDA）

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI 的 Depends 默认参数风格

[tool.ruff.lint.per-file-ignores]
# 迁移文件为（半）生成代码：autogenerate 输出天然超长行（docs/10 §7 迁移规范）
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: 需要 GPU 的测试（CI 默认跳过）"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
