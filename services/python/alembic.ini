[alembic]
script_location = alembic
prepend_sys_path = .
# Windows path separator handling (prepend_sys_path parsing; alembic 1.16+).
path_separator = os
# NOTE: keep this file pure ASCII. On Windows with GBK locale, configparser reads
# .ini with the locale encoding (alembic.util.compat.read_config_parser uses
# encoding="locale"), so non-ASCII comments break every alembic command locally
# (CI on Linux is unaffected because the locale is UTF-8 there).
# Conventions: docs/10 database design; schema source of truth: docs/06 sec.10.
# DATABASE_URL comes from the environment (never hard-coded here to avoid leaks).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
